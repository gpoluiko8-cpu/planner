<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой планировщик</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#14306b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Планировщик"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--fg:#10244a;--ac:#14306b;--on:#fff;--soft:#eef2fa;--line:#d9e1f0;--mut:#5d6b8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1730;--fg:#e8eefc;--ac:#3a62c4;--on:#fff;--soft:#142548;--line:#243d6b;--mut:#9fb0d4}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1730;--fg:#e8eefc;--ac:#3a62c4;--on:#fff;--soft:#142548;--line:#243d6b;--mut:#9fb0d4}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#main{max-width:560px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 14px;color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--soft);color:var(--fg);padding:8px 13px;border-radius:20px;font-size:14px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;align-items:flex-start}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.time{min-width:52px;color:var(--ac);font-weight:700;font-size:14px}
input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:0 4px;margin-left:auto}
.done{text-decoration:line-through;opacity:.55}
.hw{margin-top:6px;font-size:14px;display:flex;gap:6px;align-items:flex-start}
.hw input,.task input{width:auto;margin:3px 0 0}
.task{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.task input{width:20px;height:20px;margin:0}
.moods{display:flex;gap:6px;margin:8px 0}
.moods button{flex:1;font-size:26px;padding:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.moods button.on{background:var(--ac);border-color:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--ac);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--on);opacity:.6;font:inherit;font-size:12px;padding:6px 0}
nav button.on{opacity:1;font-weight:700}
nav span{display:block;font-size:20px}
.empty{color:var(--mut);text-align:center;padding:24px 0}
details summary{color:var(--ac);font-weight:600;padding:6px 0}
select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cell{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:10px;padding:8px 0;font:inherit;height:44px}
.cell.on{background:var(--ac);color:var(--on)}.cell.td{border-color:var(--ac);font-weight:700}
.cell.ev::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin:2px auto 0}.cell.on.ev::after{background:var(--on)}
.over{color:#c0392b}
h1{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:6px 0 16px}
.card{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;margin:0}
.chips{gap:14px}
.chip{background:none;border:0;border-radius:0;padding:6px 0;color:var(--mut);font-size:14px}
.chip.on{background:none;color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--ac)}
input,select{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}
textarea{background:none;border:1px solid var(--line);border-radius:6px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac)}
.btn{background:none;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:8px 14px;font-weight:500}
.cell{background:none;border:0;border-radius:50%;width:40px;height:40px;margin:auto;padding:0}
.cell.on{background:var(--ac);color:var(--on)}.cell.td{box-shadow:inset 0 0 0 1px var(--ac)}
.moods button{border:0;background:none;opacity:.4;border-radius:50%}.moods button.on{background:none;opacity:1;box-shadow:inset 0 0 0 1px var(--ac)}
nav{background:var(--bg);border-top:1px solid var(--line)}nav button{color:var(--mut);opacity:1;font-size:13px;padding:10px 0}nav button.on{color:var(--ac);font-weight:600}
#top{display:flex;justify-content:flex-end;gap:2px;max-width:560px;margin:0 auto;padding:8px 10px 0}
.ib{background:none;border:0;color:var(--mut);padding:8px;border-radius:50%;display:flex}.ib.on{color:var(--ac)}
.lb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:22px 0 4px}
.task{padding:12px 0}
body{font-weight:500}h1{font-weight:700}.t{font-weight:700}.m{font-weight:500}
.chip{font-weight:500}.chip.on{font-weight:700}.btn{font-weight:600}.time{font-weight:700}.lb{font-weight:600}
nav button{display:flex;justify-content:center;padding:12px 0}nav button svg{width:24px;height:24px}.ib svg,nav svg{stroke-width:2}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;cursor:pointer}
.sw{display:flex;gap:14px;margin:12px 0}.swb{width:26px;height:26px;border-radius:50%;border:0;padding:0}.swb.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.big{font-size:64px;font-weight:700;text-align:center;margin:28px 0 12px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar{height:3px;background:var(--line);border-radius:3px;margin:0 auto 24px;max-width:240px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .5s linear}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#main.in>*{animation:up .32s cubic-bezier(.2,.7,.2,1) both}
.chip,.btn,.cell,.ib,nav button,.swb,.moods button{transition:all .22s ease}
.btn:active,.cell:active,.chip:active,.swb:active{transform:scale(.94)}
nav svg,.ib svg{transition:transform .25s cubic-bezier(.2,.7,.2,1)}nav button.on svg{transform:translateY(-2px) scale(1.12)}.ib.on svg{transform:scale(1.12)}
html,body,.card,nav{transition:background-color .35s,color .35s,border-color .35s}
.task span{transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="top"></div><div id="main"></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
let S=null;try{S=JSON.parse(localStorage.getItem('planner')||'null')}catch(e){}
S=S||{l:[],c:['Учёба','Личное'],t:[],n:[],d:{}};S.h=S.h||[];S.sp=S.sp||{};S.s=Object.assign({n:0,nl:1,h:1,th:'sys',ac:'b'},S.s||{});S.bl=S.bl||[['08:30','10:00'],['10:10','11:40'],['12:10','13:40'],['13:50','15:20'],['15:30','17:00'],['17:10','18:40']];
const save=()=>{try{localStorage.setItem('planner',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const wkNum=d=>{d=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));return Math.ceil(((d-Date.UTC(d.getUTCFullYear(),0,1))/864e5+1)/7)};
const DN=['Пн','Вт','Ср','Чт','Пт','Сб'],MO=['😞','😕','😐','🙂','😄'];
const now=new Date();
let tab=0,W=wkNum(now)%2,D=Math.min(now.getDay()||1,6),C=0;
const dkey=()=>now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
const val=id=>($('#'+id).value||'').trim();
const TABS=[['📆','Календарь'],['📅','Занятия'],['✅','Дела'],['📝','Заметки'],['🌙','День'],['🔥','Привычки'],['⚙','Настройки'],['⏱','Таймер']];

const NI={0:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',1:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v6"/>',2:'<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',6:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const IC=[[3,'<path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7"/>'],[4,'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'],[5,'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'],[7,'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/>']];
function nav(){if(!$('#nav').children.length)$('#nav').innerHTML=[0,1,2,6].map(i=>`<button class="${i==tab?'on':''}" data-i="${i}" onclick="go(${i})" aria-label="${TABS[i][1]}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${NI[i]}</svg></button>`).join('');if(!$('#top').children.length)$('#top').innerHTML=IC.map(c=>`<button class="ib ${c[0]==tab?'on':''}" data-i="${c[0]}" onclick="go(${c[0]})" aria-label="${TABS[c[0]][1]}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${c[1]}</svg></button>`).join('');document.querySelectorAll('#nav button,#top .ib').forEach(b=>b.classList.toggle('on',+b.dataset.i==tab))}
function go(i){tab=i;render();const m=$('#main');m.classList.remove('in');void m.offsetWidth;m.classList.add('in')}

function sched(){
  const ls=S.l.filter(l=>l.w==W&&l.d==D).sort((a,b)=>a.t.localeCompare(b.t));
  return `<h1>Расписание</h1>
  <div class="chips"><button class="chip ${W?'on':''}" onclick="W=1;render()">Нечётная неделя</button><button class="chip ${W?'':'on'}" onclick="W=0;render()">Чётная неделя</button></div>
  <div class="chips">${DN.map((n,i)=>`<button class="chip ${D==i+1?'on':''}" onclick="D=${i+1};render()">${n}</button>`).join('')}</div>
  ${ls.length?ls.map(l=>`<div class="card"><div class="row"><div class="time">${esc(l.t)}${l.e?'<br><span class="m">'+esc(l.e)+'</span>':''}</div><div><div class="t"><i class="dot" style="background:${lc(l.c)}" onclick="cyc('${l.id}')"></i>${esc(l.s)}</div><div class="m">${esc(l.r)}</div></div><button class="x" onclick="delL('${l.id}')">×</button></div>
  ${l.hw?`<label class="hw"><input type="checkbox" ${l.k?'checked':''} onchange="tgL('${l.id}')"><span class="${l.k?'done':''}">ДЗ: ${esc(l.hw)}</span></label>`:''}</div>`).join(''):'<div class="empty">В этот день занятий нет</div>'}
  <details class="card"><summary>+ Добавить занятие</summary>
  <select id="lp" onchange="pairSel()"><option value="">Пара (время по звонкам)</option>${S.bl.map((b,i)=>`<option value="${i}">${i+1} пара, ${b[0]}–${b[1]}</option>`).join('')}</select><div class="row"><input id="lt" type="time" value="08:30"><input id="le" type="time" value="10:00"></div><div class="m">Цвет предмета</div><div class="sw">${[0,1,2,3,4].map(i=>`<button class="swb ${i==LC?'on':''}" style="background:${lc(i)}" onclick="pickC(${i})"></button>`).join('')}</div><input id="ls" placeholder="Предмет"><input id="lr" placeholder="Аудитория / преподаватель"><input id="lh" placeholder="Домашнее задание (необязательно)">
  <button class="btn" onclick="addL()">Добавить</button></details>
  <details class="card"><summary>Время пар (звонки)</summary>${S.bl.map((b,i)=>`<div class="row" style="align-items:center"><span class="time" style="min-width:24px">${i+1}</span><input type="time" value="${b[0]}" onchange="S.bl[${i}][0]=this.value;save()"><input type="time" value="${b[1]}" onchange="S.bl[${i}][1]=this.value;save()"></div>`).join('')}</details>`}
function addL(){const s=val('ls');if(!s)return;S.l.push({id:uid(),w:W,d:D,t:$('#lt').value||'00:00',e:$('#le').value||'',c:LC,s,r:val('lr'),hw:val('lh'),k:0});save();render()}
function delL(id){S.l=S.l.filter(l=>l.id!=id);save();render()}
function tgL(id){const l=S.l.find(l=>l.id==id);l.k=l.k?0:1;save();render()}

function todo(){
  if(C>=S.c.length)C=0;const c=S.c[C];
  const ts=S.t.filter(t=>t.c==c).sort((a,b)=>(a.k-b.k)||(a.dd||'9').localeCompare(b.dd||'9'));
  return `<h1>Список дел</h1>
  <div class="chips">${S.c.map((n,i)=>`<button class="chip ${i==C?'on':''}" onclick="C=${i};render()">${esc(n)}</button>`).join('')}</div>
  <div class="row"><input id="nt" placeholder="Новая задача в «${esc(c)}»"><button class="btn" onclick="addT()">+</button></div><div class="m">Дедлайн (необязательно)</div><input id="nd" type="date">
  ${ts.length?ts.map(t=>`<div class="task"><input type="checkbox" ${t.k?'checked':''} onchange="tgT('${t.id}')"><span><span class="${t.k?'done':''}">${esc(t.s)}</span>${t.dd?`<div class="m ${!t.k&&t.dd<dkey()?'over':''}">до ${t.dd.split('-').reverse().join('.')}</div>`:''}</span><button class="x" onclick="delT('${t.id}')">×</button></div>`).join(''):'<div class="empty">Пока пусто</div>'}
  <details class="card"><summary>Списки</summary>
  <div class="row"><input id="nc" placeholder="Название нового списка"><button class="btn" onclick="addC()">+</button></div>
  ${S.c.length>1?`<button class="btn" style="margin-top:6px" onclick="delC()">Удалить список «${esc(c)}»</button>`:''}</details>`}
function addT(){const s=val('nt');if(!s)return;S.t.push({id:uid(),c:S.c[C],s,k:0,dd:$('#nd').value});save();render()}
function tgT(id){const t=S.t.find(t=>t.id==id);t.k=t.k?0:1;save();render()}
function delT(id){S.t=S.t.filter(t=>t.id!=id);save();render()}
function addC(){const n=val('nc');if(!n||S.c.includes(n))return;S.c.push(n);C=S.c.length-1;save();render()}
function delC(){const c=S.c[C];S.c.splice(C,1);S.t=S.t.filter(t=>t.c!=c);C=0;save();render()}

function notes(){
  return `<h1>Заметки</h1>
  <input id="nh" placeholder="Заголовок"><textarea id="nb" placeholder="Текст заметки"></textarea>
  <button class="btn" onclick="addN()">Сохранить заметку</button>
  ${S.n.length?[...S.n].reverse().map(n=>`<div class="card"><div class="row"><div class="t">${esc(n.h||'Без названия')}</div><button class="x" onclick="delN('${n.id}')">×</button></div><div style="white-space:pre-wrap;margin-top:4px">${esc(n.b)}</div><div class="m" style="margin-top:6px">${esc(n.dt)}</div></div>`).join(''):'<div class="empty">Заметок пока нет</div>'}`}
function addN(){const h=val('nh'),b=val('nb');if(!h&&!b)return;S.n.push({id:uid(),h,b,dt:now.toLocaleDateString('ru-RU')});save();render()}
function delN(id){S.n=S.n.filter(n=>n.id!=id);save();render()}

function day(){
  const k=dkey(),e=S.d[k]||{m:-1,x:''};
  const past=Object.keys(S.d).filter(x=>x!=k).sort().reverse().slice(0,10);
  return `<h1>Сегодня</h1>${puz()}<h1 style="font-size:17px;margin-top:18px">Как я провёл день</h1>
  <div class="m">${now.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div>
  <div class="moods">${MO.map((m,i)=>`<button class="${e.m==i?'on':''}" onclick="setM(${i})">${m}</button>`).join('')}</div>
  <textarea id="dx" placeholder="Что сегодня было? Что получилось, что нет?">${esc(e.x)}</textarea>
  <button class="btn" onclick="saveD()">Сохранить</button>
  ${past.length?'<h1 style="font-size:17px;margin-top:20px">Прошлые дни</h1>'+past.map(x=>{const d=S.d[x];return `<div class="card"><div class="m">${x.split('-').reverse().join('.')} ${d.m>=0?MO[d.m]:''}</div><div style="white-space:pre-wrap">${esc(d.x)}</div></div>`}).join(''):''}`}
function setM(i){const k=dkey();S.d[k]=S.d[k]||{m:-1,x:''};S.d[k].x=($('#dx').value||'');S.d[k].m=i;save();render()}
function saveD(){const k=dkey();S.d[k]=S.d[k]||{m:-1,x:''};S.d[k].x=$('#dx').value;save();const b=document.querySelector('.btn');b.textContent='Сохранено ✓';setTimeout(()=>b.textContent='Сохранить',1200)}

function pairSel(){const i=$('#lp').value;if(i==='')return;$('#lt').value=S.bl[i][0];$('#le').value=S.bl[i][1]}
const P=[['Продолжи ряд: 2, 4, 8, 16, …','32'],['1, 1, 2, 3, 5, 8, …','13'],['У пастуха 17 овец, все кроме 9 разбежались. Сколько осталось?','9'],['Сколько месяцев в году имеют 28 дней?','12'],['3, 6, 11, 18, 27, …','38'],['Кирпич весит 1 кг и ещё полкирпича. Сколько кг весит кирпич?','2'],['5 станков делают 5 деталей за 5 минут. За сколько минут 100 станков сделают 100 деталей?','5'],['Сколько раз можно вычесть 5 из 25?','1|один'],['Врач дал 3 таблетки, принимать каждые полчаса. На сколько минут хватит?','60'],['2, 3, 5, 7, 11, …','13'],['Сколько раз цифра 9 встречается в числах от 1 до 100?','20'],['Улитка ползёт по столбу в 10 м: днём +3 м, ночью −2 м. На какой день она доползёт?','8'],['1, 4, 9, 16, 25, …','36'],['3 кошки ловят 3 мышей за 3 минуты. Сколько кошек поймают 100 мышей за 100 минут?','3'],['Сумма двух чисел 10, разность 4. Чему равно большее?','7'],['Бутылка и пробка стоят 110 р., бутылка дороже пробки на 100 р. Сколько стоит пробка?','5'],['1, 2, 4, 7, 11, 16, …','22'],['Сколько всего квадратов на шахматной доске 8×8?','204'],['Сколько будет 2·3 + 4·5 − 6:2?','23'],['100, 95, 85, 70, …','50'],['Отец старше сына на 30 лет, сыну 10. Через сколько лет отец будет старше вдвое?','20'],['Сколько ног у 3 пауков и 2 мух?','36'],['Сколько диагоналей у шестиугольника?','9'],['7, 14, 28, 56, …','112'],['Часы бьют 3 раза за 3 секунды. За сколько секунд они пробьют 6 раз?','7.5'],['Сколько нулей в конце числа 10! (10 факториал)?','2'],['Чему равна сумма цифр числа 2026?','10'],['Сколько секунд в часе?','3600'],['1, 3, 6, 10, 15, …','21'],['Сколько трёхзначных чисел можно составить из цифр 1, 2, 3 без повторов?','6']];
function puz(){const k=dkey(),p=pz();return `<div class="card"><div class="t">🧩 Задачка дня</div><div style="margin:6px 0">${esc(p[0])}</div>${S.sp[k]?`<div class="t">✅ Верно! Ответ: ${esc(p[1].split('|')[0])}</div>`:`<div class="row"><input id="pa" placeholder="Твой ответ"><button class="btn" onclick="chk()">ОК</button></div><div id="pm" class="m"></div>`}</div>`}
function chk(){const a=$('#pa').value.trim().toLowerCase().replace(',','.');if(pz()[1].split('|').includes(a)){S.sp[dkey()]=1;save();render()}else $('#pm').textContent='Пока не то, подумай ещё 🙂'}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>{const a=k.split('-');return new Date(+a[0],a[1]-1,+a[2])};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let cv=0,co=0,cs=dkey();
const lsOf=k=>{const d=pd(k);return S.l.filter(l=>l.w==wkNum(d)%2&&l.d==d.getDay()).sort((a,b)=>a.t.localeCompare(b.t))};
const has=k=>lsOf(k).length||S.t.some(t=>t.dd==k);
function ag(k){const a=lsOf(k).map(l=>`<div class="row" style="margin-top:4px"><span class="time">${esc(l.t)}</span><span><i class="dot" style="background:${lc(l.c)}"></i>${esc(l.s)} <span class="m">${esc(l.r)}</span>${l.hw?`<div class="m ${l.k?'done':''}">ДЗ: ${esc(l.hw)}</div>`:''}</span></div>`).join('')+S.t.filter(t=>t.dd==k).map(t=>`<div class="m ${t.k?'done':''}" style="margin-top:4px">⏰ Дедлайн: ${esc(t.s)}</div>`).join('');return a||'<div class="m">Свободный день</div>'}
function dayView(k){const d=pd(k),ls=lsOf(k),ts=S.t.filter(t=>t.dd==k);
return `<div class="m">${wkNum(d)%2?'Нечётная':'Чётная'} неделя</div><div class="lb">Занятия</div>${ls.length?ls.map(l=>`<div class="task" style="align-items:flex-start"><span class="time">${esc(l.t)}${l.e?'<br><span class="m">'+esc(l.e)+'</span>':''}</span><span><div class="t"><i class="dot" style="background:${lc(l.c)}"></i>${esc(l.s)}</div><div class="m">${esc(l.r)}</div>${l.hw?`<div class="m">ДЗ: ${esc(l.hw)}</div>`:''}</span></div>`).join(''):'<div class="m">Пар нет</div>'}<div class="lb">Задачи</div>${ts.length?ts.map(t=>`<div class="task"><input type="checkbox" ${t.k?'checked':''} onchange="tgT('${t.id}')"><span class="${t.k?'done':''}">${esc(t.s)} <span class="m">· ${esc(t.c)}</span></span><button class="x" onclick="delT('${t.id}')">×</button></div>`).join(''):'<div class="m">Задач нет</div>'}<div class="row" style="margin-top:10px"><input id="dt" placeholder="Новая задача на этот день"><button class="btn" onclick="addDT('${k}')">+</button></div>`}
function addDT(k){const s=val('dt');if(!s)return;S.t.push({id:uid(),c:S.c[0],s,k:0,dd:k});save();render()}
function cal(){const t0=pd(dkey());let body,title;
if(cv==2){const k=ymd(addD(t0,co));title=pd(k).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});body=dayView(k)}else if(cv==0){const m=addD(t0,-((t0.getDay()+6)%7)+co*7);title=`С ${m.getDate()}.${String(m.getMonth()+1).padStart(2,'0')} · ${wkNum(m)%2?'нечётная':'чётная'}`;body=[0,1,2,3,4,5,6].map(i=>{const d=addD(m,i),k=ymd(d);return `<div class="card" ${k==dkey()?'style="border-left:2px solid var(--ac);padding-left:10px"':''}><div class="t">${WD[d.getDay()]}, ${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</div>${ag(k)}</div>`}).join('')}
else{const f=new Date(t0.getFullYear(),t0.getMonth()+co,1),off=(f.getDay()+6)%7,n=new Date(f.getFullYear(),f.getMonth()+1,0).getDate();title=MN[f.getMonth()]+' '+f.getFullYear();let c=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="m">${x}</div>`).join('')+'<div></div>'.repeat(off);for(let i=1;i<=n;i++){const k=ymd(new Date(f.getFullYear(),f.getMonth(),i));c+=`<button class="cell ${k==cs?'on':''} ${k==dkey()?'td':''} ${has(k)?'ev':''}" onclick="cs='${k}';render()">${i}</button>`}
body=`<div class="grid">${c}</div><div class="card"><div class="t">${pd(cs).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}</div>${ag(cs)}<button class="btn" style="margin-top:10px" onclick="cv=2;co=Math.round((pd(cs)-pd(dkey()))/864e5);render()">Открыть день</button></div>`}
return `<h1>Календарь</h1>${S.s.h?homeTodo():''}<div class="chips"><button class="chip ${cv==2?'on':''}" onclick="cv=2;co=0;render()">День</button><button class="chip ${cv==0?'on':''}" onclick="cv=0;co=0;render()">Неделя</button><button class="chip ${cv==1?'on':''}" onclick="cv=1;co=0;render()">Месяц</button></div><div class="row" style="align-items:center;margin-bottom:6px"><button class="chip" onclick="co--;render()">‹</button><div class="t" style="flex:1;text-align:center">${title}</div><button class="chip" onclick="co++;render()">›</button></div>${body}`}
function habits(){const days=[0,1,2,3,4,5,6].map(i=>addD(pd(dkey()),i-6));
return `<h1>Привычки</h1><div class="row"><input id="hn" placeholder="Новая привычка"><button class="btn" onclick="addH()">+</button></div>${S.h.length?S.h.map(h=>{let s=0,d=pd(dkey());if(!h.d[ymd(d)])d=addD(d,-1);while(h.d[ymd(d)]){s++;d=addD(d,-1)}
return `<div class="card"><div class="row"><div class="t">${esc(h.n)}</div><span class="m" style="margin-left:auto">🔥 ${s}</span><button class="x" style="margin-left:6px" onclick="delH('${h.id}')">×</button></div><div class="grid" style="margin-top:6px">${days.map(x=>{const k=ymd(x);return `<button class="cell ${h.d[k]?'on':''} ${k==dkey()?'td':''}" onclick="tgH('${h.id}','${k}')">${h.d[k]?'✓':x.getDate()}</button>`}).join('')}</div><div class="grid">${days.map(x=>`<div class="m">${WD[x.getDay()]}</div>`).join('')}</div></div>`}).join(''):'<div class="empty">Добавь первую привычку</div>'}`}
function addH(){const n=val('hn');if(!n)return;S.h.push({id:uid(),n,d:{}});save();render()}
function tgH(id,k){const h=S.h.find(h=>h.id==id);if(h.d[k])delete h.d[k];else h.d[k]=1;save();render()}
function delH(id){S.h=S.h.filter(h=>h.id!=id);save();render()}
const F=(n,k)=>(n*0.6180339887+k*0.3247179572+k*k*0.0137)%1;
function gen(n){const p=(k,a,b)=>a+Math.floor(F(n,k)*(b-a+1)),t=n%14;let q,a;
if(t==0){const x=p(1,2,20),d=p(2,2,9);q=[0,1,2,3,4].map(i=>x+i*d).join(', ')+', …';a=x+5*d}
else if(t==1){const x=p(1,1,5),r=p(2,2,4);q=[0,1,2,3].map(i=>x*r**i).join(', ')+', …';a=x*r**4}
else if(t==2){let v=p(1,1,9),u=p(2,1,6);const l=[];for(let i=0;i<5;i++){l.push(v);v+=u;u+=2}q=l.join(', ')+', …';a=v}
else if(t==3){const s=p(1,5,15),d=p(2,3,20);q=`Отцу ${2*s+d} лет, сыну ${s}. Через сколько лет отец будет старше сына вдвое?`;a=d}
else if(t==4){const k=p(1,3,9),m=k*p(2,2,12);q=`${k} станков делают ${k} деталей за ${k} минут. За сколько минут ${m} станков сделают ${m} деталей?`;a=k}
else if(t==5){const x=p(1,10,60),y=p(2,1,x-1);q=`Сумма двух чисел ${x+y}, разность ${x-y}. Чему равно большее число?`;a=x}
else if(t==6){const u=p(1,3,6),v=p(2,1,u-1),H=p(3,10,30);q=`Улитка ползёт вверх по столбу высотой ${H} м: днём поднимается на ${u} м, ночью сползает на ${v} м. На какой день она доберётся до вершины?`;a=Math.ceil((H-u)/(u-v))+1}
else if(t==7){const x=p(1,3,5),s=p(2,1,3),c=x+p(3,2,6);q=`Часы с боем: ${x} ударов занимают ${(x-1)*s} с. Сколько секунд займут ${c} ударов?`;a=(c-1)*s}
else if(t==8){const N=p(1,50,200),k=p(2,3,9);q=`Сколько чисел от 1 до ${N} делятся на ${k}?`;a=Math.floor(N/k)}
else if(t==9){const n=p(1,10,60);q=`Чему равна сумма всех целых чисел от 1 до ${n}?`;a=n*(n+1)/2}
else if(t==10){const n=p(1,4,15);q=`Сколькими способами можно выбрать 2 дежурных из ${n} студентов?`;a=n*(n-1)/2}
else if(t==11){const x=[10,15,20,25,30,40,50,60,75][p(1,0,8)],y=20*p(2,2,30);q=`Сколько будет ${x}% от ${y}?`;a=x*y/100}
else if(t==12){const s=p(1,2,10),L=s*p(2,5,30);q=`Вдоль аллеи длиной ${L} м через каждые ${s} м посадили деревья, включая оба конца. Сколько деревьев посадили?`;a=L/s+1}
else{const x=p(1,1,9),y=p(2,1,9);q=`Каждое число равно сумме двух предыдущих: ${x}, ${y}, … Чему равно 5-е число?`;a=2*x+3*y}
return [q,String(a)]}
const pz=()=>{const n=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);return n<=30?P[n-1]:gen(n)};
const PAL={w:['Белый',['#fff','#1a1a1a','#1a1a1a','#fff','#f6f6f6','#e6e6e6','#8a8a8a'],['#111','#ececec','#ececec','#111','#1b1b1b','#2c2c2c','#9a9a9a']],b:['Белый и синий',['#fff','#10244a','#14306b','#fff','#eef2fa','#d9e1f0','#5d6b8a'],['#0b1730','#e8eefc','#3a62c4','#fff','#142548','#243d6b','#9fb0d4']],g:['Зелёный',['#fbfdfb','#1f3a2c','#3f7a5a','#fff','#eef5f0','#d6e6dc','#6b8577'],['#0f1a14','#e3f0e8','#5fa37f','#0b140f','#172a20','#27402f','#9bb8a8']],p:['Розовый',['#fffafb','#4a2c36','#b8647d','#fff','#fdeff3','#f3d9e1','#9a7480'],['#1c1216','#f6e4ea','#d98aa3','#1c1216','#2a1b21','#442a34','#c9a0ae']]};
function applyTheme(){const th=S.s.th,dk=th=='dark'||(th=='sys'&&matchMedia('(prefers-color-scheme: dark)').matches),v=PAL[S.s.ac][dk?2:1],r=document.documentElement;['--bg','--fg','--ac','--on','--soft','--line','--mut'].forEach((n,i)=>r.style.setProperty(n,v[i]));r.style.colorScheme=dk?'dark':'light';DK=dk?1:0}
let DK=0,LC=0;
const SC={w:[['#111111','#4a4a4a','#808080','#b3b3b3','#d0d0d0'],['#f5f5f5','#c8c8c8','#999999','#6b6b6b','#454545']],b:[['#0f2557','#2a62d1','#0f9bc4','#7a6fd6','#a6bef0'],['#4a74d6','#6c96e8','#38b6dc','#9a8fe6','#bcd0f6']],g:[['#1f5c3a','#3f9a5f','#12a38a','#9cb83a','#b9dcc0'],['#4fa877','#72c28f','#3fcbb2','#c2d96a','#cfeadb']],p:[['#9c2f5c','#d6527f','#e8855f','#b86bc4','#f2bfd0'],['#d9608a','#e67fa2','#f0a07f','#c98ad4','#f6d0de']]};
const lc=i=>SC[S.s.ac][DK][i||0];
function pickC(i){LC=i;document.querySelectorAll('.swb').forEach((b,j)=>b.classList.toggle('on',j==i))}
function cyc(id){const l=S.l.find(l=>l.id==id);l.c=((l.c||0)+1)%5;save();render()}
const fd=x=>x.split('-').reverse().join('.');
function soon(){if(!S.s.n)return[];const e=ymd(addD(pd(dkey()),S.s.nl));return S.t.filter(x=>!x.k&&x.dd&&x.dd<=e).sort((a,b)=>a.dd.localeCompare(b.dd))}
function banner(){const a=soon();return a.length?`<div class="card"><div class="t">Скоро дедлайн</div>${a.map(x=>`<div class="m ${x.dd<dkey()?'over':''}">${esc(x.s)} · ${fd(x.dd)}</div>`).join('')}</div>`:''}
function homeTodo(){const a=S.t.filter(x=>!x.k).sort((x,y)=>(x.dd||'9').localeCompare(y.dd||'9')).slice(0,6);return `<div class="lb" style="margin-top:0">Дела</div>${a.length?a.map(x=>`<div class="task"><input type="checkbox" onchange="tgT('${x.id}')"><span>${esc(x.s)}${x.dd?`<span class="m ${x.dd<dkey()?'over':''}"> · ${fd(x.dd)}</span>`:''}</span></div>`).join(''):'<div class="m">Всё сделано</div>'}<div style="height:10px"></div>`}
function sett(){const s=S.s,seg=(k,o)=>o.map(x=>`<button class="chip ${s[k]==x[0]?'on':''}" onclick="setS('${k}','${x[0]}')">${x[1]}</button>`).join('');
return `<h1>Настройки</h1><div class="lb">Уведомления</div><label class="task"><input type="checkbox" ${s.n?'checked':''} onchange="setN(this.checked)"><span>Напоминать о дедлайнах</span></label>${s.n?`<div class="chips">${seg('nl',[['0','в день дедлайна'],['1','за 1 день'],['2','за 2 дня'],['3','за 3 дня']])}</div><div class="m" style="margin-top:8px">Напоминание появляется вверху при открытии приложения. Системное уведомление приходит, если браузер разрешил и страница открыта.</div>`:''}<div class="lb">Главный экран</div><label class="task"><input type="checkbox" ${s.h?'checked':''} onchange="setS('h',this.checked?1:0)"><span>Показывать список дел</span></label><div class="lb">Тема</div><div class="chips">${seg('th',[['sys','Системная'],['light','Светлая'],['dark','Тёмная']])}</div><div class="lb">Цвет</div><div class="chips" style="flex-wrap:wrap">${Object.keys(PAL).map(k=>`<button class="chip ${s.ac==k?'on':''}" onclick="setS('ac','${k}')">${PAL[k][0]}</button>`).join('')}</div><div class="lb">Резервная копия</div><details class="card"><summary>Сохранить копию данных</summary><div class="m">Скопируй текст и сохрани в заметках телефона или отправь себе в мессенджер.</div><textarea id="bk" readonly>${esc(JSON.stringify(S))}</textarea><button class="btn" onclick="bkCopy()">Скопировать</button></details><details class="card"><summary>Восстановить из копии</summary><textarea id="br" placeholder="Вставь сюда скопированный текст"></textarea><button class="btn" onclick="bkRest()">Восстановить</button><div id="bm" class="m"></div></details>`}
function setS(k,v){S.s[k]=k=='nl'?+v:v;save();applyTheme();render()}
function setN(c){S.s.n=c?1:0;if(c){try{Notification.requestPermission()}catch(e){}}save();render()}
let PM={m:0,end:0,left:1500,run:0,n:S.pn&&S.pn.d==dkey()?S.pn.c:0};
const PD=[1500,300],fmtT=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function pTick(){if(!PM.run)return;PM.left=Math.max(0,Math.round((PM.end-Date.now())/1000));const e=$('#pt'),b=$('#pb');if(e)e.textContent=fmtT(PM.left);if(b)b.style.width=(100-PM.left/PD[PM.m]*100)+'%';if(PM.left<=0){PM.run=0;if(PM.m==0){PM.n++;S.pn={d:dkey(),c:PM.n};save()}try{new Notification(PM.m?'Перерыв закончился':'Время отдохнуть')}catch(x){}PM.m=1-PM.m;PM.left=PD[PM.m];if(tab==7)render()}}
setInterval(pTick,500);
function pGo(){if(!PM.run)PM.end=Date.now()+PM.left*1000;PM.run=PM.run?0:1;render()}
function pMode(m){PM.m=m;PM.run=0;PM.left=PD[m];render()}
function pom(){return `<h1>Таймер</h1><div class="chips"><button class="chip ${PM.m==0?'on':''}" onclick="pMode(0)">Фокус 25</button><button class="chip ${PM.m==1?'on':''}" onclick="pMode(1)">Перерыв 5</button></div><div class="big" id="pt">${fmtT(PM.left)}</div><div class="bar"><i id="pb" style="width:${100-PM.left/PD[PM.m]*100}%"></i></div><div class="row" style="justify-content:center;gap:14px"><button class="btn" onclick="pGo()">${PM.run?'Пауза':'Старт'}</button><button class="btn" onclick="pMode(PM.m)">Сброс</button></div><div class="m" style="text-align:center;margin-top:16px">Сегодня циклов фокуса: ${PM.n}</div>`}
async function bkCopy(){const b=event.target,t=$('#bk');t.select();let ok=0;try{await navigator.clipboard.writeText(t.value);ok=1}catch(e){try{ok=document.execCommand('copy')}catch(e2){}}b.textContent=ok?'Скопировано ✓':'Выдели текст и скопируй вручную'}
function bkRest(){try{const x=JSON.parse($('#br').value);if(!Array.isArray(x.l)||!Array.isArray(x.t)||!Array.isArray(x.c))throw 0;x.h=x.h||[];x.sp=x.sp||{};x.bl=x.bl||S.bl;x.n=x.n||[];x.d=x.d||{};x.s=Object.assign({n:0,nl:1,h:1,th:'sys',ac:'b'},x.s||{});S=x;save();applyTheme();render()}catch(e){$('#bm').textContent='Не получилось: проверь, что вставлен весь текст копии'}}
function render(){nav();$('#main').innerHTML=banner()+[cal,sched,todo,notes,day,habits,sett,pom][tab]()}
applyTheme();render();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){}
try{const a=soon();if(a.length&&Notification.permission==='granted')new Notification('Скоро дедлайн',{body:a.map(x=>x.s).join(', ')})}catch(e){}
